<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><title>Protected Resume</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.lock-screen{background:#fff;padding:50px;border-radius:15px;box-shadow:0 10px 50px rgba(0,0,0,0.3);text-align:center;max-width:400px;width:90%}
.lock-screen h1{font-size:32px;margin-bottom:10px;color:#333}
.lock-screen p{color:#666;margin-bottom:30px}
input{width:100%;padding:15px;border:2px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:15px}
input:focus{outline:none;border-color:#667eea}
button{width:100%;padding:15px;background:#667eea;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#5568d3}
button:disabled{opacity:0.6;cursor:not-allowed}
.error{color:#e74c3c;font-size:14px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="lock-screen">
<h1>🔒 Protected</h1>
<p>Enter password to view resume</p>
<input type="password" id="pwd" placeholder="Password" />
<button id="btn" onclick="check()">Unlock</button>
<div class="error" id="err">Incorrect password</div>
</div>
<script>
const API='https://portfoilo-4lwl.onrender.com/api/resume/verify';
async function check(){
const p=document.getElementById('pwd').value;
const b=document.getElementById('btn');
const e=document.getElementById('err');
b.disabled=true;b.textContent='Checking...';e.style.display='none';
try{
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
const d=await r.json();
if(d.success){
sessionStorage.setItem('auth','1');
window.location.href='resume-edit.html';
}else{
e.style.display='block';
document.getElementById('pwd').value='';
}
}catch(ex){
e.textContent='Connection error';
e.style.display='block';
}
b.disabled=false;b.textContent='Unlock';
}
document.getElementById('pwd').addEventListener('keypress',e=>{if(e.key==='Enter')check()});
if(sessionStorage.getItem('auth')==='1')window.location.href='resume-edit.html';
</script>
</body></html>
