<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Protected Resume</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.lock{background:#fff;padding:50px 40px;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;max-width:420px;width:90%}
.lock h1{font-size:36px;margin-bottom:15px;color:#333}
.lock p{color:#666;margin-bottom:30px;font-size:15px}
input{width:100%;padding:15px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;margin-bottom:20px;transition:border 0.3s}
input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1)}
button{width:100%;padding:15px;background:#667eea;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.3s}
button:hover{background:#5568d3}
button:active{transform:scale(0.98)}
button:disabled{opacity:0.6;cursor:not-allowed}
.error{color:#e74c3c;font-size:14px;margin-top:15px;display:none;font-weight:500}
.success{color:#27ae60;font-size:14px;margin-top:15px;display:none;font-weight:500}
</style>
</head>
<body>
<div class="lock">
<h1>🔒</h1>
<p><strong>Protected Resume</strong><br/>Enter password to continue</p>
<input type="password" id="pwd" placeholder="Enter password" autofocus/>
<button id="btn" onclick="verify()">Unlock Resume</button>
<div class="error" id="err"></div>
<div class="success" id="succ">✓ Access granted</div>
</div>
<script>
const API='https://portfoilo-4lwl.onrender.com/api/resume/verify';

async function verify(){
const pwd=document.getElementById('pwd');
const btn=document.getElementById('btn');
const err=document.getElementById('err');
const succ=document.getElementById('succ');

if(!pwd.value){
err.textContent='Please enter password';
err.style.display='block';
return;
}

btn.disabled=true;
btn.textContent='Verifying...';
err.style.display='none';
succ.style.display='none';

try{
const response=await fetch(API,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({password:pwd.value})
});

const data=await response.json();

if(response.ok && data.success){
succ.style.display='block';
sessionStorage.setItem('resume_auth','verified');
setTimeout(()=>window.location.href='resume-edit.html',800);
}else{
err.textContent='Incorrect password. Please try again.';
err.style.display='block';
pwd.value='';
pwd.focus();
btn.disabled=false;
btn.textContent='Unlock Resume';
}
}catch(error){
console.error('Error:',error);
err.textContent='Server error. Please try again or contact admin.';
err.style.display='block';
btn.disabled=false;
btn.textContent='Unlock Resume';
}
}

document.getElementById('pwd').addEventListener('keypress',(e)=>{
if(e.key==='Enter')verify();
});

// Check if already authenticated
if(sessionStorage.getItem('resume_auth')==='verified'){
window.location.href='resume-edit.html';
}
</script>
</body>
</html>
