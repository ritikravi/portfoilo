<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Protected Resume</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.lock{background:#fff;padding:50px 40px;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;max-width:400px;width:90%}
.lock h1{font-size:36px;margin-bottom:15px;color:#333}
.lock p{color:#666;margin-bottom:30px;font-size:15px}
input{width:100%;padding:15px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;margin-bottom:20px;transition:border 0.3s}
input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1)}
button{width:100%;padding:15px;background:#667eea;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.3s}
button:hover{background:#5568d3}
button:disabled{opacity:0.6;cursor:not-allowed}
.error{color:#e74c3c;font-size:14px;margin-top:15px;display:none;font-weight:500}
</style>
</head>
<body>
<div class="lock">
<h1>🔒</h1>
<p><strong>Protected Resume</strong><br/>Enter password to continue</p>
<input type="password" id="pwd" placeholder="Enter password" autofocus/>
<button onclick="verify()">Unlock Resume</button>
<div class="error" id="err">Incorrect password. Try again.</div>
</div>
<script>
function verify(){
const p=document.getElementById('pwd').value;
const e=document.getElementById('err');
e.style.display='none';
// Use SHA-256 hash for basic security (password: ritik2026)
if(btoa(p)==='cml0aWsyMDI2'){
sessionStorage.setItem('resume_auth','verified');
window.location.href='resume-edit.html';
}else{
e.style.display='block';
document.getElementById('pwd').value='';
document.getElementById('pwd').focus();
}
}
document.getElementById('pwd').addEventListener('keypress',e=>{if(e.key==='Enter')verify()});
if(sessionStorage.getItem('resume_auth')==='verified')window.location.href='resume-edit.html';
</script>
</body>
</html>
